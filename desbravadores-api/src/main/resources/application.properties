# Configuração da Conexão com o Banco de Dados MySQL
# Valores padrão = ambiente de desenvolvimento local. Em produção, defina as variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/desbravadores_db?useTimezone=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Dialeto do Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Outras configurações do JPA
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update

# Configuração do JSON Web Token (JWT)
# ATENÇÃO: jwt.secret abaixo é um valor de DESENVOLVIMENTO. Em produção defina JWT_SECRET
# com uma chave aleatória de pelo menos 32 caracteres (requisito do algoritmo HS256).
jwt.secret=${JWT_SECRET:dev-only-insecure-secret-change-me-in-prod-1234}
# Tempo de expiração do token em milissegundos. Padrão: 8 horas (8 * 60 * 60 * 1000).
jwt.expiration.ms=${JWT_EXPIRATION_MS:28800000}

# Credenciais do utilizador administrador padrão, criado automaticamente se não existir.
# Valores padrão = ambiente de desenvolvimento local.
admin.default.email=${ADMIN_EMAIL:adm@gmail.com}
admin.default.password=${ADMIN_PASSWORD:adm123}

# Origens permitidas pelo CORS (separadas por vírgula).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}

# Limita o tamanho máximo de cada ficheiro para 5MB
spring.servlet.multipart.max-file-size=5MB
# Limita o tamanho total da requisição (útil para múltiplos uploads) para 5MB
spring.servlet.multipart.max-request-size=5MB

# Configuração do diretório de upload
file.upload-dir=file
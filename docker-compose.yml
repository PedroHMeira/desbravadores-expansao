services:
  mysql:
    image: mysql:8
    container_name: desbravadores-mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: ${MYSQL_ALLOW_EMPTY_PASSWORD:-yes}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-desbravadores_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./desbravadores-api
    container_name: desbravadores-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/desbravadores_db?useTimezone=true&serverTimezone=UTC}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-in-prod-1234}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-28800000}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-adm@gmail.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adm123}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5500,http://localhost:5500}
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/file

volumes:
  mysql-data:
  uploads-data:
